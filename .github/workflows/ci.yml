name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-site:
    name: Validate static site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          test -f index.html
          test -f README.md

      - name: Check for obvious secrets
        run: |
          grep -RniE "(api_key|apikey|secret|password|token)\s*[:=]" . \
            --exclude-dir=.git \
            --exclude-dir=.github \
            --exclude="sql-injection.js" > findings.txt || true

          if [ -s findings.txt ]; then
            echo "Potential secrets found:"
            cat findings.txt
            exit 1
          fi